name: Rendu The Flux

on:
  workflow_dispatch:
    inputs:
      scale:
        description: "Taille : 0.5 = 960x540 (rapide) / 1 = 1920x1080 (lent)"
        default: "0.5"
      every:
        description: "Images : 2 = 30 img/s (rapide) / 1 = 60 img/s (lent)"
        default: "2"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        acte: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Preparer le projet
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3 libdbus-1-3 libatk1.0-0t64 libatk-bridge2.0-0t64 libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libgbm1 libcups2t64 libpango-1.0-0 libcairo2 libxshmfence1 fonts-liberation unzip
          mkdir proj && unzip -q "$(ls *.zip | head -1)" -d proj
          D=$(dirname "$(find proj -maxdepth 2 -name package.json | head -1)")
          echo "PROJ=$D" >> $GITHUB_ENV
          sed -i "s/dpr={1}/dpr={typeof window !== 'undefined' ? window.devicePixelRatio || 1 : 1}/" "$D/src/fx/Stage.tsx"
      - name: Installer
        working-directory: ${{ env.PROJ }}
        run: |
          npm install --no-audit --no-fund
          npx remotion browser ensure
      - name: Rendre l'acte ${{ matrix.acte }}
        working-directory: ${{ env.PROJ }}
        run: |
          mkdir -p out
          npx remotion render Acte${{ matrix.acte }} out/acte${{ matrix.acte }}.mp4 --gl=swangle --concurrency=3 --scale=${{ inputs.scale }} --every-nth-frame=${{ inputs.every }} \
          || npx remotion render Acte${{ matrix.acte }} out/acte${{ matrix.acte }}.mp4 --gl=swangle --concurrency=1 --scale=${{ inputs.scale }} --every-nth-frame=${{ inputs.every }}
      - uses: actions/upload-artifact@v4
        with:
          name: acte-${{ matrix.acte }}
          path: ${{ env.PROJ }}/out/acte${{ matrix.acte }}.mp4

  assembler:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: acte-*
          merge-multiple: true
          path: actes
      - name: Assembler
        run: |
          cd actes
          for i in 1 2 3 4 5; do echo "file 'acte$i.mp4'"; done > list.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i list.txt -c:v copy -c:a aac -b:a 192k the-flux-trailer.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: THE-FLUX-TRAILER-FINAL
          path: actes/the-flux-trailer.mp4
